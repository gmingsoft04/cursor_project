spring:
  datasource:
    url: jdbc:h2:mem:saas;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:sql/schema-h2.sql
      data-locations: classpath:sql/data-h2.sql
  h2:
    console:
      enabled: true

pagehelper:
  helper-dialect: h2

# 若前端需携带 Cookie 跨域，可配置白名单并启用凭证（与 ruoyi.web.cors-allowed-origins 对应）：
# ruoyi:
#   web:
#     cors-allowed-origins:
#       - http://localhost:5173

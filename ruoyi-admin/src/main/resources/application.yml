spring:
  application:
    name: universal-saas
  profiles:
    active: dev

server:
  port: 8080

mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.ruoyi.**.domain
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  reasonable: true
  support-methods-arguments: true

ruoyi:
  jwt:
    secret: ChangeMeRuoyiJwtSecretKeyMustBeLongEnoughForDevelopmentUseOnly
    expire-minutes: 120
  web:
    # 为空：CORS 使用通配来源且不携带凭证（适合 Authorization 头传 JWT）。生产可改为具体前端域名列表并携带凭证。
    cors-allowed-origins: []
    # 同一 IP 每分钟最多调用登录接口次数（进程内限流）；≤0 关闭。多实例请改网关/Redis 限流。
    login-max-requests-per-minute: 60
    # 登录限流 Caffeine：最多跟踪的 IP 条目数；某 IP 无访问多久后淘汰其限流状态
    login-rate-limiter-max-entries: 20000
    login-rate-limiter-expire-after-access-minutes: 10

logging:
  level:
    com.ruoyi: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{tenantId:-}/%X{userId:-}] %logger{40} - %msg%n"

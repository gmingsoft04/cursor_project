[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fastcharge-leads"
version = "0.1.0"
description = "Foreign trade lead generation system for phone fast chargers and fast charging cables."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cursor Agent" }]
license = { text = "MIT" }
keywords = ["lead-generation", "foreign-trade", "serper", "apollo", "linkedin", "customs"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.scripts]
fastcharge-leads = "fastcharge_leads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
